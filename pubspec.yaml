name: fluid_glass
description: Liquid Glass backdrop effects for Flutter, with refraction, chromatic dispersion, blur, highlights and continuous-corner shapes.
version: 0.1.3
repository: https://github.com/TIANLI0/FluidGlass

screenshots:
  - description: Liquid glass buttons in four styles over a wallpaper backdrop.
    path: doc/screenshots/buttons.webp
  - description: A slider whose thumb refracts and stretches as it is dragged.
    path: doc/screenshots/slider.webp
  - description: Bottom tabs with a glass pill that magnifies the tab beneath it.
    path: doc/screenshots/bottom_tabs.webp
  - description: A pop-up menu whose glass panel blooms out of its anchor.
    path: doc/screenshots/menu.webp
  - description: Glass button groups, a segmented control and a bare panel.
    path: doc/screenshots/toolbar.webp
  - description: A lock screen clock drawn through a signed-distance-field texture.
    path: doc/screenshots/lock_screen.webp
  - description: A control centre of glass tiles over a live backdrop.
    path: doc/screenshots/control_center.webp
  - description: A draggable magnifier lens over body text.
    path: doc/screenshots/magnifier.webp

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/refraction.frag
    - shaders/refraction_dispersion.frag
    - shaders/highlight_default.frag
    - shaders/highlight_ambient.frag
    - shaders/interactive_highlight.frag
